<div id="vigor-cardio-options">
  <style>
    #vigor-cardio-options { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #vigor-cardio-options * { box-sizing: border-box; }
    #vigor-cardio-options .vc-stage { min-height: 1250px; padding: 24px 8px 36px; display: flex; justify-content: center; align-items: flex-start; }
    #vigor-cardio-options .vc-phone {
      --vc-bg: light-dark(#f1f4ef, #141a18); --vc-card: light-dark(#fcfdfb, #222b26); --vc-soft: light-dark(#e8ede5, #2b3630);
      --vc-ink: light-dark(#18231d, #f0f5ee); --vc-muted: light-dark(#5e6b62, #aebbB0); --vc-line: light-dark(#dce3da, #38453c);
      --vc-lime: #9be317; --vc-on: #192509; --vc-accent: light-dark(#426410, #b0e65c); --vc-tint: light-dark(#e1edce, #31412b);
      --vc-cardio: light-dark(#326d63, #9ac7b2); --vc-cardio-tint: light-dark(#dfece5, #253d33);
      --vc-sport: light-dark(#815916, #e8c18a); --vc-sport-tint: light-dark(#f2e6d3, #3b3428);
      --vc-glow: light-dark(#ffffffb8, #ebffed0d); --vc-shadow: light-dark(#20332212, #00000035);
      --vc-radius: 23px; --vc-depth: 1;
      width: 390px; max-width: 100%; min-height: 980px; border-radius: 36px; overflow: hidden;
      color: var(--vc-ink); background: radial-gradient(ellipse at 20% 0%, light-dark(#dfe9d5, #253222), transparent 48%), var(--vc-bg);
      box-shadow: 0 16px 45px var(--vc-shadow); border: 1px solid var(--vc-line); font-size: 15px; line-height: 1.4;
      position: relative; display: flex; flex-direction: column;
    }
    #vigor-cardio-options button, #vigor-cardio-options input, #vigor-cardio-options select { font: inherit; }
    #vigor-cardio-options button { color: inherit; -webkit-tap-highlight-color: transparent; }
    #vigor-cardio-options .vc-status { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 8px; font-size: 13px; font-weight: 600; }
    #vigor-cardio-options .vc-status span:last-child { display:flex; gap:7px; align-items:center; }
    #vigor-cardio-options .vc-status svg { width:15px; height:15px; }
    #vigor-cardio-options .vc-preview { margin: 0; text-align:center; color:var(--vc-muted); font-size:11px; letter-spacing:.6px; text-transform:uppercase; }
    #vigor-cardio-options .vc-content { padding: 22px 20px 20px; flex: 1; }
    #vigor-cardio-options h2, #vigor-cardio-options h3, #vigor-cardio-options p { margin:0; }
    #vigor-cardio-options h2 { font-size:30px; letter-spacing:-1px; font-weight:750; line-height:1.15; }
    #vigor-cardio-options h3 { font-size:20px; letter-spacing:-.45px; font-weight:650; }
    #vigor-cardio-options .vc-titlebar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    #vigor-cardio-options .vc-overline { display:block; color:var(--vc-muted); font-size:11px; letter-spacing:1.3px; text-transform:uppercase; margin-bottom:8px; font-weight:650; }
    #vigor-cardio-options .vc-sub { color:var(--vc-muted); font-size:13px; margin-top:6px; }
    #vigor-cardio-options .vc-section { margin-top:24px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #vigor-cardio-options .vc-section h3 { font-size:16px; }
    #vigor-cardio-options .vc-surface { background:linear-gradient(145deg,var(--vc-glow),transparent 62%),var(--vc-card); border-radius:var(--vc-radius); padding:19px; box-shadow:0 6px 20px var(--vc-shadow),inset 0 1px 0 var(--vc-glow); }
    #vigor-cardio-options .vc-surface + .vc-surface { margin-top:12px; }
    #vigor-cardio-options .vc-button { border:0; background:var(--vc-soft); border-radius:15px; min-height:46px; padding:10px 14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; }
    #vigor-cardio-options .vc-primary { width:100%; background:linear-gradient(150deg,#b7ed63,var(--vc-lime)); color:var(--vc-on); min-height:49px; margin-top:18px; box-shadow:0 4px 14px #9be31715; }
    #vigor-cardio-options .vc-button:disabled { opacity:.5; }
    #vigor-cardio-options .vc-link { background:none; border:0; padding:8px 0; color:var(--vc-accent); font-size:13px; text-align:left; display:inline-flex; align-items:center; gap:4px; }
    #vigor-cardio-options .vc-icon-button { width:44px; min-height:44px; border-radius:15px; background:var(--vc-soft); border:0; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    #vigor-cardio-options svg { width:20px; height:20px; flex-shrink:0; }
    #vigor-cardio-options .vc-segment { display:flex; gap:4px; padding:4px; background:var(--vc-soft); border-radius:15px; margin:12px 0 20px; }
    #vigor-cardio-options .vc-segment button { flex:1; min-height:37px; padding:7px 6px; border:0; border-radius:11px; background:transparent; color:var(--vc-muted); font-size:13px; }
    #vigor-cardio-options .vc-segment button[aria-pressed="true"] { background:var(--vc-card); color:var(--vc-ink); box-shadow:0 2px 6px var(--vc-shadow); }
    #vigor-cardio-options .vc-row { display:flex; align-items:center; gap:12px; padding:13px 0; }
    #vigor-cardio-options .vc-row + .vc-row { border-top:1px solid var(--vc-line); }
    #vigor-cardio-options .vc-row-main { flex:1; min-width:0; }
    #vigor-cardio-options .vc-row-main strong { display:block; font-weight:600; font-size:15px; }
    #vigor-cardio-options .vc-row-main small { display:block; margin-top:3px; font-size:12px; color:var(--vc-muted); }
    #vigor-cardio-options .vc-row-end { color:var(--vc-muted); font-size:12px; text-align:right; flex-shrink:0; }
    #vigor-cardio-options .vc-row-end strong { display:block; color:var(--vc-ink); font-size:15px; font-weight:600; }
    #vigor-cardio-options .vc-marker { width:36px; height:36px; border-radius:13px; display:flex; align-items:center; justify-content:center; color:var(--vc-accent); background:var(--vc-tint); flex-shrink:0; }
    #vigor-cardio-options .vc-marker.cardio { color:var(--vc-cardio); background:var(--vc-cardio-tint); }
    #vigor-cardio-options .vc-marker.sport { color:var(--vc-sport); background:var(--vc-sport-tint); }
    #vigor-cardio-options .vc-marker.rest { color:var(--vc-muted); background:var(--vc-soft); }
    #vigor-cardio-options .vc-metrics { display:flex; gap:25px; margin:23px 0 18px; }
    #vigor-cardio-options .vc-metrics strong { display:block; font-size:24px; font-weight:650; letter-spacing:-.7px; }
    #vigor-cardio-options .vc-metrics small { font-size:12px; color:var(--vc-muted); }
    #vigor-cardio-options .vc-inline { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
    #vigor-cardio-options .vc-tag { display:inline-flex; align-items:center; gap:5px; border-radius:8px; padding:4px 8px; background:var(--vc-soft); color:var(--vc-muted); font-size:11px; }
    #vigor-cardio-options .vc-tag.cardio { background:var(--vc-cardio-tint); color:var(--vc-cardio); }
    #vigor-cardio-options .vc-note { display:flex; gap:9px; align-items:flex-start; padding-top:14px; color:var(--vc-muted); font-size:12px; }
    #vigor-cardio-options .vc-note svg { width:16px; height:16px; margin-top:1px; }
    #vigor-cardio-options .vc-nav { margin:8px 14px 15px; padding:8px; display:flex; justify-content:space-around; background:linear-gradient(160deg,var(--vc-glow),transparent),var(--vc-soft); border-radius:26px; }
    #vigor-cardio-options .vc-nav button { border:0; border-radius:20px; background:none; color:var(--vc-muted); min-height:49px; min-width:77px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:3px; font-size:11px; }
    #vigor-cardio-options .vc-nav button:first-child { background:var(--vc-bg); color:var(--vc-accent); }
    #vigor-cardio-options .vc-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:13px; }
    #vigor-cardio-options .vc-day { border:0; padding:12px; border-radius:16px; text-align:left; background:var(--vc-soft); min-height:96px; }
    #vigor-cardio-options .vc-day small { display:block; color:var(--vc-muted); font-size:11px; margin-bottom:7px; }
    #vigor-cardio-options .vc-day strong { font-size:13px; display:block; margin-top:5px; font-weight:600; }
    #vigor-cardio-options .vc-day svg { width:18px; height:18px; color:var(--vc-accent); }
    #vigor-cardio-options .vc-day.cardio svg { color:var(--vc-cardio); }
    #vigor-cardio-options .vc-day.sport svg { color:var(--vc-sport); }
    #vigor-cardio-options .vc-cycle-rail { display:flex; gap:5px; margin:15px 0 8px; }
    #vigor-cardio-options .vc-cycle-rail span { flex:1; height:6px; border-radius:4px; background:var(--vc-soft); }
    #vigor-cardio-options .vc-cycle-rail span:first-child { background:var(--vc-lime); }
    #vigor-cardio-options .vc-field { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:14px 0; font-size:14px; }
    #vigor-cardio-options input[type="number"] { width:75px; min-height:44px; background:var(--vc-soft); color:var(--vc-ink); border:0; border-radius:12px; text-align:center; font-size:16px; }
    #vigor-cardio-options select { width:100%; background:var(--vc-soft); color:var(--vc-ink); border:0; min-height:45px; padding:8px 10px; border-radius:12px; margin-top:8px; }
    #vigor-cardio-options .vc-choice { width:100%; display:flex; align-items:center; gap:12px; background:var(--vc-card); border:1px solid var(--vc-line); border-radius:17px; padding:15px; min-height:66px; text-align:left; margin:9px 0; }
    #vigor-cardio-options .vc-choice[aria-pressed="true"] { background:var(--vc-tint); border-color:var(--vc-accent); }
    #vigor-cardio-options .vc-choice strong { font-size:15px; font-weight:600; display:block; }
    #vigor-cardio-options .vc-choice small { font-size:12px; color:var(--vc-muted); display:block; margin-top:3px; }
    #vigor-cardio-options .vc-back { display:flex; align-items:center; gap:5px; border:0; background:none; color:var(--vc-accent); padding:0; min-height:38px; margin-bottom:12px; font-size:13px; }
    #vigor-cardio-options .vc-footer { padding-top:18px; color:var(--vc-muted); font-size:11px; }
    #vigor-cardio-options .vc-sheet { position:absolute; inset:180px 0 0; z-index:5; border-radius:30px 30px 0 0; background:var(--vc-card); padding:14px 22px 25px; box-shadow:0 -30px 80px var(--vc-shadow); }
    #vigor-cardio-options .vc-grab { width:38px; height:4px; border-radius:3px; background:var(--vc-line); margin:0 auto 20px; }
    #vigor-cardio-options .vc-progress { height:9px; background:var(--vc-soft); border-radius:6px; margin-top:14px; overflow:hidden; }
    #vigor-cardio-options .vc-progress span { display:block; width:36%; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--vc-cardio),var(--vc-lime)); }
    #vigor-cardio-options .vc-warning { color:var(--vc-sport); margin-top:13px; font-size:12px; }
    #vigor-cardio-options .vc-budget { display:flex; align-items:center; justify-content:space-between; padding-top:13px; color:var(--vc-muted); font-size:12px; }
    #vigor-cardio-options .vc-blocks { display:flex; gap:3px; height:44px; margin-top:18px; }
    #vigor-cardio-options .vc-blocks span { border-radius:7px; background:var(--vc-cardio-tint); flex:1; }
    #vigor-cardio-options .vc-blocks span:nth-child(2) { flex:3; background:var(--vc-cardio); opacity:.7; }
    #vigor-cardio-options .vc-sensor { display:flex; align-items:center; justify-content:space-between; padding:15px 0; }
    #vigor-cardio-options .vc-sensor strong { font-size:25px; font-weight:600; }
    #vigor-cardio-options .vc-priority { font-size:12px; color:var(--vc-accent); }
    #vigor-cardio-options .vc-phone button { cursor:inherit; }
    @media(max-width:400px) { #vigor-cardio-options .vc-stage { padding:12px 0 28px; min-height:1370px; } #vigor-cardio-options .vc-content { padding:20px 15px; } #vigor-cardio-options .vc-metrics { gap:18px; } #vigor-cardio-options h2 { font-size:27px; } }
    @media(prefers-reduced-motion:no-preference) { #vigor-cardio-options .vc-sheet { animation:vc-rise .2s ease-out; } @keyframes vc-rise { from { transform:translateY(25px); opacity:.5; } to { transform:translateY(0); opacity:1; } } }
  </style>
  <div class="viz-carousel viz-dotted-background" aria-label="Vigor cardio planning directions" data-previous-label="Anterior" data-next-label="Siguiente">
    <section data-variant="Unified cycle" aria-label="Unified cycle design"><div class="vc-stage"><div class="vc-phone" data-design="unified" aria-label="Unified training cycle"></div></div></section>
    <section data-variant="Cardio focus" aria-label="Cardio focus design" hidden><div class="vc-stage"><div class="vc-phone" data-design="cardio" aria-label="Cardio focused home"></div></div></section>
    <section data-variant="Visual planner" aria-label="Visual planner design" hidden><div class="vc-stage"><div class="vc-phone" data-design="planner" aria-label="Visual hybrid planner"></div></div></section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('vigor-cardio-options');
      const saved = window.openai?.widgetState?.privateContent || {};
      const states = {};
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const defs = { upper:['Upper body','55 min','dumbbell',''], lower:['Lower body','55 min','dumbbell',''], bike:['Easy cycling','20 min','bike','cardio'], run:['Run / walk','25 min','footprints','cardio'], padel:['Padel lesson','60 min · fixed','circle-dot','sport'], rest:['Rest','Recovery','moon','rest'] };
      function schedule(s) { if(s.mode==='CARDIO') return ['bike','rest','run','rest','padel','rest','rest'].concat(Array(Math.max(0,s.days-7)).fill('rest')); return (s.days===7 ? ['upper','lower','rest','run','upper','padel','lower'] : ['upper','lower','rest','run','upper','padel','rest','lower'].concat(Array(s.days-8).fill('rest'))); }
      function definition(s,key) { if(!['bike','run'].includes(key))return defs[key];const modality=s.modalities[key==='bike'?0:Math.min(1,s.modalities.length-1)]||'Cycling';return [modality==='Running'?'Easy run / walk':modality==='Machines'?'Easy machine cardio':'Easy cycling',`${s.duration[modality]||20} min`,modality==='Running'?'footprints':modality==='Machines'?'gauge':'bike','cardio']; }
      function total(s) {return (s.mode==='HYBRID'?220:0)+60+Number.parseInt(definition(s,'bike')[1])+Number.parseInt(definition(s,'run')[1]);}
      function active(s) {return schedule(s).filter(x=>x!=='rest').length;}
      function feasible(s) {return s.budget>=total(s) && s.active>=active(s);}
      function rows(s) { return schedule(s).slice(0,4).map((key,i)=>{ const d=definition(s,key); const addedBike=s.mode==='HYBRID' && i===0; return `<div class="vc-row"><div class="vc-marker ${d[3]}">${icon(i===0?'check':d[2])}</div><div class="vc-row-main"><strong>${d[0]}</strong><small>Day ${i+1}${addedBike?' · + '+definition(s,'bike')[1]+' cardio':key==='padel'?' · booked class':''}</small></div><div class="vc-row-end"><strong>${d[1].split(' · ')[0]}</strong>${key==='padel'?'Fixed':''}</div></div>`; }).join(''); }
      function header(title, action='plus') { return `<div class="vc-titlebar"><h2>${title}</h2><button class="vc-icon-button" data-action="setup" aria-label="Create a training block">${icon(action)}</button></div>`; }
      function back(label='Training') { return `<button class="vc-back" data-action="home">${icon('chevron-left')}${label}</button>`; }
      function nav() { return `<nav class="vc-nav" aria-label="Vigor navigation"><button data-action="home">${icon('dumbbell')}Training</button><button data-action="bio">${icon('activity')}Bio</button><button data-action="profile">${icon('circle-user-round')}Profile</button></nav>`; }
      function summary(s) { const minutes=total(s); return `<div class="vc-budget"><span>${s.mode==='CARDIO'?'2 cardio sessions + sport':'4 strength + 2 cardio + sport'}</span><strong>${minutes} / ${s.budget} min</strong></div>${s.budget<minutes?'<p class="vc-warning">This example exceeds your time budget. Review the dose before accepting.</p>':''}${s.active<active(s)?'<p class="vc-warning">This example needs '+active(s)+' active days. Your maximum is '+s.active+'.</p>':''}${s.days===7 && s.mode==='HYBRID'?'<p class="vc-warning">Padel and lower-body strength are consecutive. An 8-day cycle adds a recovery day.</p>':''}`; }
      function unified(s) { return `${header('Training')}<div class="vc-segment"><button aria-pressed="false" data-action="strength">Strength</button><button aria-pressed="false" data-action="cardio">Cardio</button><button aria-pressed="true" data-action="home">Hybrid</button></div><div class="vc-surface"><span class="vc-overline">Next session</span><div class="vc-titlebar" style="margin-bottom:0"><h2>Easy cycling</h2><span class="vc-marker cardio">${icon('bike')}</span></div><p class="vc-sub">After Upper body · conversational pace</p><div class="vc-metrics"><div><strong>20</strong><small>minutes</small></div><div><strong>2–4</strong><small>target effort / 10</small></div></div><button class="vc-button vc-primary" data-action="session">${icon('play')}View session</button></div><div class="vc-section"><h3>Your routine</h3><button class="vc-link" data-action="preview">View block ${icon('arrow-up-right')}</button></div><div class="vc-surface" style="padding-top:16px;padding-bottom:6px"><div class="vc-inline" style="justify-content:space-between"><strong>Stronger, further</strong><span class="vc-priority">Balanced</span></div><p class="vc-sub">Microcycle 1 / 6 · ${s.days}-day cycle</p><div class="vc-cycle-rail">${Array(6).fill('<span></span>').join('')}</div>${rows(s)}<button class="vc-link" data-action="preview">View all ${s.days} days →</button></div><button class="vc-link" data-action="sport">+ Add a sport or activity</button>`; }
      function cardio(s) { return `${header('Training')}<div class="vc-segment"><button aria-pressed="false" data-action="home">Strength</button><button aria-pressed="true" data-action="cardio">Cardio</button></div><div class="vc-surface"><span class="vc-overline">Cardiovascular block</span><h2>Build your engine</h2><p class="vc-sub">General fitness · cycling + running</p><div class="vc-budget"><span>Microcycle 1 / 6</span><span>2 planned sessions</span></div><div class="vc-progress"><span></span></div><button class="vc-link" data-action="preview">View the shared schedule →</button></div><div class="vc-section"><h3>Up next</h3><span class="vc-priority">Easy day</span></div><button class="vc-choice" data-action="session"><span class="vc-marker cardio">${icon('bike')}</span><span style="flex:1"><strong>Easy cycling</strong><small>20 min · full sentences comfortably</small></span>${icon('chevron-right')}</button><div class="vc-surface"><div class="vc-row" style="padding:0"><span class="vc-marker">${icon('dumbbell')}</span><div class="vc-row-main"><strong>Compatible with Upper / Lower</strong><small>Your current strength routine</small></div></div><p class="vc-sub" style="margin-top:14px">Easy cycling follows Upper body. Lower body has its own day.</p></div><div class="vc-section"><h3>Sports & life</h3><button class="vc-link" data-action="sport">Add activity</button></div><div class="vc-surface"><div class="vc-row" style="padding:0"><span class="vc-marker sport">${icon('circle-dot')}</span><div class="vc-row-main"><strong>Padel lesson</strong><small>Day 6 · 60 min · booked class</small></div>${icon('lock-keyhole')}</div><p class="vc-sub" style="margin-top:14px">Planned activity. Its actual intensity will be reviewed after recording.</p></div><button class="vc-button vc-primary" data-action="setup">Create a cardio or hybrid block</button>`; }
      function preview(s) { const scheduleItems=schedule(s); return `${back()}<span class="vc-overline">Block preview</span><div class="vc-titlebar" style="margin-bottom:8px"><h2>Your ${s.days}-day rhythm</h2><button class="vc-icon-button" data-action="setup" aria-label="Edit plan inputs">${icon('sliders-horizontal')}</button></div><p class="vc-sub">${s.mode==='HYBRID'?'Strength + cardio · '+s.priority:'Cardio · general fitness'}</p><div class="vc-segment">${[7,8,10].map(n=>`<button data-days="${n}" aria-pressed="${s.days===n}">${n} days</button>`).join('')}</div><div class="vc-surface"><div class="vc-inline" style="justify-content:space-between"><strong>${s.mode==='HYBRID'?'4 strength sessions':'2 cardio sessions'}</strong><span class="vc-sub">Every ${s.days} days</span></div><div class="vc-grid">${scheduleItems.map((key,i)=>`<button class="vc-day ${definition(s,key)[3]}" data-action="${key==='bike'||key==='run'?'session':key==='padel'?'sport':'day'}" data-day="${i+1}"><small>Day ${i+1}${i===0?' · today':''}</small>${icon(definition(s,key)[2])}<strong>${definition(s,key)[0]}</strong></button>`).join('')}</div>${s.mode==='HYBRID'?'<p class="vc-sub">Day 1 also includes '+definition(s,'bike')[1]+' cardio.</p>':''}${summary(s)}</div><p class="vc-note">${icon('info')}<span>${s.days===10?'The longer cycle lowers your weekly training frequency.':s.days===8?'An extra day separates padel from Lower body.':'An 8-day alternative gives the fixed class more space.'}</span></p><button class="vc-button vc-primary" data-action="accept" ${!feasible(s)?'disabled':''}>Use this rhythm</button><button class="vc-link" data-action="setup">Edit goals & availability</button>`; }
      function setup(s) { let inside=''; if(s.step===0) inside=`<span class="vc-overline">Create block · 1 / 3</span><h2>What are we building?</h2><p class="vc-sub">One plan that fits around your life.</p>${[['HYBRID','Hybrid','Strength and cardiovascular fitness','layers'],['CARDIO','Cardio','A cardiovascular block on its own','bike']].map(([value,title,sub,ic])=>`<button class="vc-choice" data-mode="${value}" aria-pressed="${s.mode===value}">${icon(ic)}<span><strong>${title}</strong><small>${sub}</small></span></button>`).join('')}${s.mode==='HYBRID'?`<div class="vc-section"><h3>Which goal comes first?</h3></div><div class="vc-segment">${['Strength','Balanced','Cardio'].map(x=>`<button data-priority="${x}" aria-pressed="${s.priority===x}">${x}</button>`).join('')}</div>`:''}<div class="vc-section"><h3>Your modalities</h3></div>${['Cycling','Running','Machines'].map(x=>`<button class="vc-choice" data-modality="${x}" aria-pressed="${s.modalities.includes(x)}">${icon(x==='Cycling'?'bike':x==='Running'?'footprints':'gauge')}<span style="flex:1"><strong>${x}</strong></span>${s.modalities.includes(x)?icon('check'):icon('plus')}</button>`).join('')}`;
        if(s.step===1) inside=`<span class="vc-overline">Create block · 2 / 3</span><h2>Your current practice</h2><p class="vc-sub">Tell us about each activity separately.</p>${s.modalities.map(x=>`<div class="vc-surface" style="margin-top:18px"><strong>${x}</strong><label><select data-experience="${x}" aria-label="${x} experience">${['New to this','Returning','Training regularly','Not sure'].map(v=>`<option ${s.experience[x]===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="vc-field">Usual comfortable session<input type="number" min="5" max="180" value="${s.duration[x]||20}" data-duration="${x}" aria-label="${x} usual minutes"></label><span class="vc-sub">Minutes, including warm-up and cool-down</span></div>`).join('')}<p class="vc-note">${icon('info')}<span>New or uncertain history starts with easy familiarization. Your strength level is separate.</span></p>`;
        if(s.step===2) inside=`<span class="vc-overline">Create block · 3 / 3</span><h2>Make room for it</h2><p class="vc-sub">Review your strength routine and fixed activities together.</p><div class="vc-surface" style="margin-top:20px"><label class="vc-field">Total minutes per cycle<input type="number" min="30" max="1200" data-budget value="${s.budget}"></label><label class="vc-field">Maximum active days<input type="number" min="1" max="10" data-active value="${s.active}"></label><div class="vc-section"><h3>Cycle length</h3></div><div class="vc-segment">${[7,8,10].map(n=>`<button data-days="${n}" aria-pressed="${s.days===n}">${n} days</button>`).join('')}</div><p class="vc-sub">The preview makes changes in frequency visible.</p></div><div class="vc-section"><h3>Already in your schedule</h3></div><div class="vc-surface">${s.mode==='HYBRID'?`<div class="vc-row" style="padding-top:0"><span class="vc-marker">${icon('dumbbell')}</span><div class="vc-row-main"><strong>Upper / Lower</strong><small>4 sessions · preserve prescriptions</small></div>${icon('lock-keyhole')}</div>`:''}<div class="vc-row" style="padding-bottom:0"><span class="vc-marker sport">${icon('circle-dot')}</span><div class="vc-row-main"><strong>Padel lesson</strong><small>60 min · booked commitment</small></div>${icon('lock-keyhole')}</div></div><button class="vc-link" data-action="sport">+ Add another commitment</button>`;
        return `${back()}${inside}<button class="vc-button vc-primary" data-action="next" ${!s.modalities.length?'disabled':''}>${s.step===2?'Review the schedule':'Continue'}${icon('arrow-right')}</button><button class="vc-link" data-action="home">Cancel creation</button>`; }
      function session(s) { return `${back()}<span class="vc-overline">Cardio · full session</span><div class="vc-titlebar"><h2>Easy cycling</h2><span class="vc-marker cardio">${icon('bike')}</span></div><div class="vc-surface"><div class="vc-metrics" style="margin-top:0"><div><strong>20 min</strong><small>full duration</small></div><div><strong>2–4 / 10</strong><small>target effort</small></div></div><p class="vc-sub">You can speak in full sentences comfortably.</p><div class="vc-blocks" aria-label="4 minutes warm-up, 12 minutes easy cycling, 4 minutes cool-down"><span></span><span></span><span></span></div>${[['Warm-up','4 min'],['Easy cycling','12 min'],['Cool-down','4 min']].map(([a,b])=>`<div class="vc-row"><div class="vc-row-main"><strong>${a}</strong></div><span class="vc-row-end">${b}</span></div>`).join('')}</div><div class="vc-section"><h3>During the session</h3><span class="vc-tag">Sensor phase preview</span></div><div class="vc-surface"><div class="vc-sensor"><div><span class="vc-overline">Heart rate</span><strong>${s.sensor?'132 bpm':'—'}</strong></div><span class="vc-marker cardio">${icon('heart-pulse')}</span></div><p class="vc-sub">${s.sensor?'Example sensor · updated just now':'No sensor connected · use time and effort'}</p><button class="vc-link" data-action="sensor">${s.sensor?'Preview without a sensor':'Preview a connected sensor'}</button></div><button class="vc-button vc-primary" data-action="finish">Preview session finish</button>`; }
      function sheet(s) { if(!s.sheet) return ''; if(s.sheet==='sport') return `<div class="vc-sheet"><div class="vc-grab"></div><div class="vc-titlebar"><h3>Add a sport</h3><button class="vc-icon-button" data-action="close" aria-label="Close sport picker">${icon('x')}</button></div><p class="vc-sub">Booked for tomorrow, a booked class or already done.</p>${[['planned','Plan an activity','One-off match or recurring lesson','calendar-plus'],['recorded','Record an activity','Actual time and optional session effort','check']].map(([id,title,sub,ic])=>`<button class="vc-choice" data-sport-choice="${id}">${icon(ic)}<span><strong>${title}</strong><small>${sub}</small></span></button>`).join('')}<div class="vc-section"><h3>Padel tomorrow · 60 min</h3></div><div class="vc-surface"><p>This overlaps your planned lower-body work.</p><p class="vc-sub">Review the timing, or use the class instead of an easy session. Confirm the adjustment yourself.</p><button class="vc-button vc-primary" data-action="sportreview">Review the plan</button></div></div>`;
        if(s.sheet==='sportreview') return `<div class="vc-sheet"><div class="vc-grab"></div><div class="vc-titlebar"><h3>Fit padel into the plan</h3><button class="vc-icon-button" data-action="close" aria-label="Close plan review">${icon('x')}</button></div><button class="vc-choice" data-action="sportdone">${icon('calendar-arrow-up')}<span><strong>Move the lower-body session</strong><small>Review an open slot and the next cycle boundary.</small></span></button><button class="vc-choice" data-action="sportdone">${icon('replace')}<span><strong>Use instead of the easy run</strong><small>Record the actual class before assessing its intensity.</small></span></button><button class="vc-choice" data-action="sportdone">${icon('plus')}<span><strong>Keep it as an extra activity</strong><small>The possible overlap remains visible.</small></span></button><p class="vc-note">${icon('info')}<span>A match is not automatically equivalent to an interval workout.</span></p></div>`;
        if(s.sheet==='finish') return `<div class="vc-sheet"><div class="vc-grab"></div><div class="vc-titlebar"><h3>Session complete</h3><button class="vc-icon-button" data-action="close" aria-label="Close finish preview">${icon('x')}</button></div><div class="vc-metrics"><div><strong>20 min</strong><small>example duration</small></div><div><strong>Easy</strong><small>planned stimulus</small></div></div><div class="vc-section"><h3>How hard was this session?</h3></div><p class="vc-sub">Optional · whole-session effort</p><div class="vc-grid" style="grid-template-columns:repeat(5,minmax(0,1fr))">${Array.from({length:10},(_,i)=>`<button class="vc-button" data-effort="${i+1}" aria-pressed="${s.effort===i+1}" style="padding:8px;${s.effort===i+1?'background:var(--vc-tint);color:var(--vc-accent)':''}">${i+1}</button>`).join('')}</div><div class="vc-budget"><span>Very easy</span><span>Extremely hard</span></div><button class="vc-button vc-primary" data-action="finishdone">${s.effort?'Finish example':'Finish without an answer'}</button></div>`;
        return `<div class="vc-sheet"><div class="vc-grab"></div><div class="vc-titlebar"><h3>${esc(s.sheet)}</h3><button class="vc-icon-button" data-action="close" aria-label="Close example">${icon('x')}</button></div><p class="vc-sub">Design preview saved locally. No training record was changed.</p><button class="vc-button vc-primary" data-action="close">Done</button></div>`; }
      function persist() { window.openai?.setWidgetState?.({modelContent:{preview:'Vigor cardio planning',designs:['Unified cycle','Cardio focus','Visual planner']},privateContent:states})?.catch(()=>{}); }
      function render(phone) { const key=phone.dataset.design,s=states[key]; let html=s.screen==='setup'?setup(s):s.screen==='session'?session(s):s.screen==='preview'?preview(s):key==='unified'?unified(s):key==='cardio'?cardio(s):preview(s); phone.innerHTML=`<div class="vc-status"><span>9:41</span><span>${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><p class="vc-preview">Design preview · illustrative data</p><main class="vc-content" aria-live="polite">${html}</main>${nav()}${sheet(s)}`; phone.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction')); if(window.lucide) window.lucide.createIcons(); }
      for(const phone of root.querySelectorAll('.vc-phone')) { const key=phone.dataset.design; states[key]=Object.assign({screen:'home',step:0,mode:'HYBRID',priority:'Balanced',days:8,budget:360,active:6,modalities:['Cycling','Running'],experience:{Cycling:'Training regularly',Running:'New to this',Machines:'Not sure'},duration:{Cycling:20,Running:25,Machines:20},sensor:false,effort:null,sheet:null},saved[key]||{}); render(phone);
        phone.addEventListener('click',e=>{const b=e.target.closest('button');if(!b || b.disabled)return; const s=states[key],action=b.dataset.action;
          if(b.dataset.days)s.days=Number(b.dataset.days); if(b.dataset.mode)s.mode=b.dataset.mode;if(b.dataset.priority)s.priority=b.dataset.priority;
          if(b.dataset.modality){const x=b.dataset.modality;s.modalities=s.modalities.includes(x)?s.modalities.filter(v=>v!==x):[...s.modalities,x];}
          if(b.dataset.effort)s.effort=Number(b.dataset.effort); if(b.dataset.sportChoice)s.sheet='sportreview';
          if(action==='home'){s.screen='home';s.sheet=null;} if(action==='setup'){s.screen='setup';s.step=0;s.sheet=null;} if(action==='next'){if(s.step<2)s.step++;else s.screen='preview';}
          if(action==='preview')s.screen='preview';if(action==='session')s.screen='session'; if(action==='sport')s.sheet='sport'; if(action==='sportreview')s.sheet='sportreview'; if(action==='close')s.sheet=null;
          if(action==='sensor')s.sensor=!s.sensor;if(action==='finish')s.sheet='finish';if(action==='finishdone'){s.screen='home';s.sheet=null;} if(action==='accept')s.sheet='Example rhythm selected';if(action==='sportdone')s.sheet='Example adjustment selected';
          if(action==='bio')s.sheet='Recovery context';if(action==='profile')s.sheet='Profile';if(action==='strength')s.sheet='Strength stays in the shared plan';if(action==='cardio')s.screen=key==='cardio'?'home':'session';if(action==='day')s.sheet='Day '+b.dataset.day;
          render(phone);persist();
        });
        phone.addEventListener('change',e=>{const el=e.target,s=states[key];if(el.dataset.experience)s.experience[el.dataset.experience]=el.value;if(el.dataset.duration)s.duration[el.dataset.duration]=Math.max(5,Math.min(180,Number(el.value)||20));if(el.hasAttribute('data-budget'))s.budget=Math.max(30,Math.min(1200,Number(el.value)||360));if(el.hasAttribute('data-active'))s.active=Math.max(1,Math.min(10,Number(el.value)||6));persist();});
        if(globalThis.Tweak){const appearance={radius:23,depth:true};const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--vc-radius',appearance.radius+'px');phone.style.setProperty('--vc-shadow',appearance.depth?'light-dark(#20332212, #00000035)':'transparent');}});tweak.addSlider(appearance,'radius',{label:'Card radius',min:14,max:30,unit:'px'});tweak.addToggle(appearance,'depth',{label:'Soft surface depth'});}
      }
      window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.privateContent;if(!next)return;for(const phone of root.querySelectorAll('.vc-phone')){const key=phone.dataset.design;if(next[key]){states[key]=Object.assign(states[key],next[key]);render(phone);}}});
    })();
  </script>
</div>
